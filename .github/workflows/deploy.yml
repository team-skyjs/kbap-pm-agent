# backend/·frontend/ → 같은 커밋 태그의 이미지 두 개 → 홈서버(self-hosted 러너)에서 compose pull·up·헬스체크
# 운영 env 파일은 deploy job이 GitHub Secrets/Variables에서 생성하고 끝나면 삭제
# Secrets: DATABASE_URL, ANTHROPIC_API_KEY, OPENAI_API_KEY, GH_PAT(→GITHUB_TOKEN), ACCESS_TOKEN, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
# Variables: PUBLIC_BASE_URL, CORS_ORIGINS, AGENT_MODEL, CODE_SUMMARY_MODEL, AMPLITUDE_MCP_URL, LLM_BUDGET_USD
name: deploy

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'deploy/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy   # 동시성 1: 실행 중 1개 + 대기 1개(더 쌓이면 오래된 대기분은 취소, 최신만 유지)
  cancel-in-progress: false   # 진행 중인 배포는 끊지 않음

env:
  IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web

jobs:
  build:
    name: build and push images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: deploy on home server
    needs: build
    runs-on: [self-hosted, kbap]   # 홈서버 러너
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - uses: docker/login-action@v3   # 비공개 패키지 pull 용
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: write env file from secrets and variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          CODE_SUMMARY_MODEL: ${{ vars.CODE_SUMMARY_MODEL }}
          AMPLITUDE_MCP_URL: ${{ vars.AMPLITUDE_MCP_URL }}
          LLM_BUDGET_USD: ${{ vars.LLM_BUDGET_USD }}
        run: |
          : "${DATABASE_URL:?secret DATABASE_URL 없음}"
          : "${PUBLIC_BASE_URL:?variable PUBLIC_BASE_URL 없음}"
          umask 077
          cat > deploy/.env.prod <<ENV
          AGENT_MODE=real
          DATABASE_URL=$DATABASE_URL
          CORS_ORIGINS=${CORS_ORIGINS:-https://team-skyjs.github.io}
          ACCESS_TOKEN=$ACCESS_TOKEN
          PUBLIC_BASE_URL=$PUBLIC_BASE_URL
          AGENT_MODEL=${AGENT_MODEL:-anthropic:claude-sonnet-5-5}
          CODE_SUMMARY_MODEL=${CODE_SUMMARY_MODEL:-anthropic:claude-haiku-5-5}
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          OPENAI_API_KEY=$OPENAI_API_KEY
          AGENT_MAX_TURNS=10
          AGENT_TIMEOUT_SECONDS=170
          LLM_BUDGET_USD=${LLM_BUDGET_USD:-200}
          AMPLITUDE_MCP_URL=${AMPLITUDE_MCP_URL:-https://mcp.amplitude.com/mcp}
          AMPLITUDE_TOOLS=get_amplitude_context,query_amplitude_data
          TOOL_RESULT_MAX_CHARS=3000
          GITHUB_TOKEN=$GH_PAT
          REPOS_DIR=/data/repos
          CODE_GLOB=*.{ts,tsx,js,jsx}
          TRACK_CALL_PATTERN=track\(EVENTS\.(\w+)
          SCREEN_GLOB=src/app/**/*.tsx
          ENV
          echo "env 파일 생성: $(grep -c = deploy/.env.prod)개 키"

      - name: compose pull · up · health
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_WEB: ${{ env.IMAGE_WEB }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}   # 두 이미지 모두 같은 커밋 해시 태그로 고정 배포(latest 아님)
          COMPOSE_FILE: ${{ github.workspace }}/deploy/docker-compose.kbap-pm-agent.yml
          ENV_FILE: ${{ github.workspace }}/deploy/.env.prod
        run: bash deploy/deploy.kbap-pm-agent.sh

      - name: remove env file
        if: always()
        run: rm -f deploy/.env.prod

  verify:
    name: verify through Cloudflare Access
    needs: deploy
    runs-on: ubuntu-latest   # 바깥 경로(Access → 터널 → nginx → 백엔드) 검사라 홈서버 밖에서 실행
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend/checks

      - uses: astral-sh/setup-uv@v6

      - name: check_b8 with service token
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}   # Variables는 로그 마스킹이 안 되므로 스크립트가 호스트를 출력하지 않음
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # 서비스 토큰 미설정이면 경고 후 통과(대시보드 설정 전 매 배포가 실패로 보여 진짜 실패를 가리지 않게).
          # 두 Secrets가 들어가는 순간 엄격 모드: 검사 실패 시 job 실패
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::warning::서비스 토큰 미설정, 운영 검사 생략"
            exit 0
          fi
          : "${PUBLIC_BASE_URL:?variable PUBLIC_BASE_URL 없음}"
          uv run --no-project --python 3.12 --with httpx python backend/checks/check_b8.py

  release:
    name: create GitHub release
    needs: [build, deploy]   # 배포 성공 시에만
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.${{ github.run_number }}
    steps:
      - name: create release with auto-generated notes
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes \
            --notes "배포 이미지: \`${{ env.IMAGE }}:${{ needs.build.outputs.tag }}\`, \`${{ env.IMAGE_WEB }}:${{ needs.build.outputs.tag }}\` · 커밋 ${{ github.sha }}"
