# frontend/ → GitHub Pages (https://<owner>.github.io/kbap-pm-agent/)
# 백엔드 주소는 레포 Settings → Variables의 VITE_API_BASE_URL (ADR-5, ADR-12)
name: pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy   # 백엔드·프론트 공통. 전역 동시성 1: 실행 중 1개 + 대기 1개(더 쌓이면 오래된 대기분이 취소되고 최신만 남는다)
  cancel-in-progress: false   # 진행 중인 배포는 끊지 않는다

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check -- f6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
